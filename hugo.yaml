markup:
  goldmark:
    renderer:
      unsafe: true
    extensions:
      passthrough:
        enable: true
        delimiters:
          block:
            - ['\\[', '\\]']
            - ['$$', '$$']
          inline:
            - ['\\(', '\\)']
            - ['$', '$']
  tableOfContents:
    startLevel: 2
    endLevel: 3
  highlight:
    style: dracula
    lineNos: false
