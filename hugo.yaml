baseURL: 'https://pierre-chamoun.github.io/'
locale: en-us
title: Pierre Chamoun

params:
  name:        Pierre Chamoun
  shortname:   PC
  tagline:     MSc Robotics Student
  institution: McGill University
  email:       pierre.chamoun@mail.mcgill.ca
  github:      'youtube.com'
  linkedin:    'youtube.com'
  scholar:     'youtube.com'
  twitter:     ''
  cv:          'lol.pdf'
  description: Academic portfolio of Pierre Chamoun, MSc Robotics student.
  accentColor: '#00838a'
  avatar: /img/pic.jpg   # add your photo to static/img/ and uncomment

menus:
  main:
    - name: About
      url: /
      weight: 1
    - name: Publications
      url: /publications/
      weight: 2
    - name: News
      url: /news/
      weight: 3
    - name: Blog
      url: /blog/
      weight: 4

markup:
  goldmark:
    renderer:
      unsafe: true
    extensions:
      passthrough:
        enable: true
        delimiters:
          block:
            - ['\\[', '\\]']
            - ['$$', '$$']
          inline:
            - ['\\(', '\\)']
            - ['$', '$']
  tableOfContents:
    startLevel: 2
    endLevel: 3
  highlight:
    style: dracula
    lineNos: false
