{{ define "main" }}
<div class="container">

  <header class="post-header">
    <h1 class="post-title">{{ .Title }}</h1>
    <div class="post-meta">
      <time datetime="{{ .Date | time.Format "2006-01-02" }}">
        {{ .Date | time.Format "January 2, 2006" }}
      </time>
      <span>{{ .ReadingTime }} min read</span>
    </div>
    {{ if .Params.tags }}
    <div class="post-card-tags" style="margin-top:0.65rem;">
      {{ range .Params.tags }}
      <a href="{{ "/tags/" | relURL }}{{ . | urlize }}/" class="post-tag">{{ . | title }}</a>
      {{ end }}
    </div>
    {{ end }}
  </header>

  <div class="post-content prose">
    {{ .Content }}
  </div>

</div>
{{ end }}
