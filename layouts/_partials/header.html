<div class="container">
  <a href="{{ site.Home.RelPermalink }}" class="site-title">{{ site.Params.name | default site.Title }}</a>

  {{/* Desktop inline nav */}}
  <nav class="site-nav-wrap">
    <ul class="site-nav">
      {{ range site.Menus.main }}
      <li>
        <a href="{{ .URL }}"{{ if eq $.RelPermalink .URL }} class="active"{{ end }}>{{ .Name }}</a>
      </li>
      {{ end }}
    </ul>
  </nav>

  {{/* Burger — mobile only */}}
  <button class="burger" id="burger-btn" aria-label="Toggle navigation" aria-expanded="false">
    <svg class="burger-open" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
      <line x1="3" y1="6"  x2="21" y2="6"/>
      <line x1="3" y1="12" x2="21" y2="12"/>
      <line x1="3" y1="18" x2="21" y2="18"/>
    </svg>
    <svg class="burger-close" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" style="display:none">
      <line x1="18" y1="6"  x2="6"  y2="18"/>
      <line x1="6"  y1="6"  x2="18" y2="18"/>
    </svg>
  </button>
</div>

<script>
document.addEventListener('DOMContentLoaded', function () {
  var btn     = document.getElementById('burger-btn');
  var drawer  = document.getElementById('nav-drawer');
  var overlay = document.getElementById('nav-overlay');
  if (!btn || !drawer || !overlay) return;
  var iconOpen  = btn.querySelector('.burger-open');
  var iconClose = btn.querySelector('.burger-close');

  function open() {
    drawer.classList.add('open');
    overlay.classList.add('open');
    btn.setAttribute('aria-expanded', 'true');
    iconOpen.style.display  = 'none';
    iconClose.style.display = 'block';
    document.body.style.overflow = 'hidden';
  }

  function close() {
    drawer.classList.remove('open');
    overlay.classList.remove('open');
    btn.setAttribute('aria-expanded', 'false');
    iconOpen.style.display  = 'block';
    iconClose.style.display = 'none';
    document.body.style.overflow = '';
  }

  btn.addEventListener('click', function () {
    drawer.classList.contains('open') ? close() : open();
  });

  overlay.addEventListener('click', function (e) {
    if (!drawer.contains(e.target)) close();
  });

  drawer.querySelectorAll('a').forEach(function (a) {
    a.addEventListener('click', close);
  });
});
</script>
