baseURL = 'https://pierre-chamoun.github.io'
locale = 'en-us'
title = 'Pierre Chamoun'
theme = 'portfolio'

[params]
  name        = 'Pierre Chamoun'
  shortname   = 'PC'
  tagline     = 'MSc Robotics Student'
  institution = 'Your University'
  email       = 'pierre.chamoun@outlook.com'
  github      = 'youtube.com'
  scholar     = 'youtube.com'
  linkedin    = 'youtube.com'
  twitter     = ''
  cv          = ''
  description = 'Academic portfolio of Pierre Chamoun, MSc Robotics student.'
  # avatar    = '/img/avatar.jpg'   # add your photo to static/img/ and uncomment

[markup]
  [markup.goldmark.renderer]
    unsafe = true  # allow raw HTML in markdown
  [markup.goldmark.extensions.passthrough]
    enable = true  # pass math delimiters through untouched
    [markup.goldmark.extensions.passthrough.delimiters]
      block  = [['\\[', '\\]'], ['$$', '$$']]
      inline = [['\\(', '\\)'], ['$', '$']]
  [markup.highlight]
    style   = 'dracula'
    lineNos = false

[[menus.main]]
  name   = 'About'
  url    = '/'
  weight = 1

